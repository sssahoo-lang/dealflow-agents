spring:
  application:
    name: analytics-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/crm}
    username: ${SPRING_DATASOURCE_USERNAME:analytics}
    password: ${SPRING_DATASOURCE_PASSWORD:analytics}
    hikari:
      # Small on purpose: this service shares a Postgres instance with the CRM,
      # so it must not be able to starve the API of connections.
      maximum-pool-size: 5
      pool-name: analytics-pool

  flyway:
    enabled: true
    schemas: analytics
    default-schema: analytics
    # The analytics role owns its schema, so no superuser is needed.
    baseline-on-migrate: false

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

analytics:
  outbox:
    consumer-name: analytics
    # fixedDelay between polls. Seconds of staleness is fine for a dashboard;
    # see OutboxPoller for why LISTEN/NOTIFY isn't worth it here.
    poll-interval-ms: ${ANALYTICS_OUTBOX_POLL_INTERVAL_MS:2000}
    batch-size: 200
    max-attempts: 5
    # Turned off in slice tests so no background poller races the assertions.
    enabled: ${ANALYTICS_OUTBOX_ENABLED:true}

  jwt:
    # Must match the Python API's JWT_SECRET.
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-in-production-32b+}

logging:
  level:
    com.dealflow.analytics: INFO
