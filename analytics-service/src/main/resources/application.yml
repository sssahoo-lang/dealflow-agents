spring:
  application:
    name: analytics-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/crm}
    username: ${SPRING_DATASOURCE_USERNAME:analytics}
    password: ${SPRING_DATASOURCE_PASSWORD:analytics}
    hikari:
      # Small on purpose: this service shares a Postgres instance with the CRM,
      # so it must not be able to starve the API of connections.
      maximum-pool-size: 5
      pool-name: analytics-pool

  flyway:
    enabled: true
    schemas: analytics
    default-schema: analytics
    # The analytics role owns its schema, so no superuser is needed.
    baseline-on-migrate: false

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

analytics:
  outbox:
    consumer-name: analytics
    # fixedDelay between polls. Seconds of staleness is fine for a dashboard;
    # see OutboxPoller for why LISTEN/NOTIFY isn't worth it here.
    poll-interval-ms: ${ANALYTICS_OUTBOX_POLL_INTERVAL_MS:2000}
    batch-size: 200
    max-attempts: 5
    # Turned off in slice tests so no background poller races the assertions.
    enabled: ${ANALYTICS_OUTBOX_ENABLED:true}

  rules:
    # Hourly at five past. A rule about the ABSENCE of activity has no triggering
    # event, so this cannot be event-driven -- it has to be swept.
    cron: ${ANALYTICS_RULES_CRON:0 5 * * * *}
    enabled: ${ANALYTICS_RULES_ENABLED:true}

  jwt:
    # The CRM's public keys. This service holds no signing material of its own --
    # it can verify the CRM's tokens and cannot mint one.
    jwks-uri: ${JWKS_URI:http://api:8000/.well-known/jwks.json}
    # An unknown kid triggers a refetch, and the kid comes from the caller, so
    # refetching is rate limited: without a floor a stream of junk tokens would
    # make this service an amplifier pointed at the CRM.
    refresh-cooldown: ${JWKS_REFRESH_COOLDOWN:30s}
    timeout: ${JWKS_TIMEOUT:3s}

# Distributed tracing, opt-in. `otel.sdk.disabled` is the master switch: it
# defaults to true, so `mvn test` and the analytics-test compose profile stay
# exactly as network-free as before this existed. docker-compose flips it off
# and points otlp.endpoint at the bundled Jaeger, so `docker compose up` shows a
# live trace with no extra step.
otel:
  sdk:
    disabled: ${OTEL_SDK_DISABLED:true}
  service:
    name: dealflow-analytics
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
  traces:
    exporter: otlp
  # This service has no incoming HTTP traffic worth tracing on its own -- the
  # story is the outbox event that arrived, not the /actuator/health poll. Both
  # off; OutboxDispatcher creates its span by hand, linked to the CRM's request.
  instrumentation:
    spring-webmvc:
      enabled: false
    logback-appender:
      enabled: false

logging:
  level:
    com.dealflow.analytics: INFO
