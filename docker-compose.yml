name: dealflow-agents

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
      # Pin the timezone explicitly. The legacy created_at columns are naive
      # `timestamp` and only hold UTC by accident of the image default -- make it
      # a guarantee, since a second service now reads these timestamps.
      TZ: UTC
      PGTZ: UTC
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:-analytics}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs ONLY on an empty data directory. On an existing volume, apply by hand:
      #   docker compose exec -T db psql -U crm -d crm < db/init/01-analytics-role.sql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: brings the schema to head, then exits. Both api and analytics wait
  # for it to *complete*, which is cleaner than coupling the analytics boot to the
  # API's health -- analytics needs the schema, not the API.
  migrate:
    build: .
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+psycopg://crm:crm@db:5432/crm
      TZ: UTC
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # All-in-one Jaeger (v2 -- natively OTLP, no COLLECTOR_OTLP_ENABLED flag
  # needed): collector, in-memory storage (traces don't need to survive a
  # restart -- this demonstrates the plumbing, it isn't a retention system) and
  # the query UI, one container. OTLP/HTTP ingestion on 4318, UI on 16686.
  # See app/observability/tracing.py for why the exporters that feed this are
  # opt-in rather than always-on, and README's "Design decisions" for the story
  # of what a trace here actually shows: a single trace spanning the FastAPI
  # request, the durable outbox row, and the Java consumer that later resumes it.
  jaeger:
    image: jaegertracing/jaeger:2.1.0
    ports:
      - "16686:16686"
      - "4318:4318"

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://crm:crm@db:5432/crm
      # Empty generates an ephemeral RSA keypair at startup, which is why this
      # runs with no setup. Tokens then do not survive a restart -- set a PEM for
      # anything longer-lived. See app/core/keys.py.
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_ALGORITHM: RS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      LLM_PROVIDER: ${LLM_PROVIDER:-stub}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Empty disables tracing (the default everywhere except compose -- see
      # app/observability/tracing.py). Set here so `docker compose up` shows a
      # live trace with no extra step; a bare `pytest` run leaves this unset and
      # stays exactly as dependency-free as every other suite in this repo.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      TZ: UTC
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  analytics:
    build: ./analytics-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/crm
      SPRING_DATASOURCE_USERNAME: analytics
      SPRING_DATASOURCE_PASSWORD: ${ANALYTICS_DB_PASSWORD:-analytics}
      # No signing material here. This service fetches the CRM's PUBLIC keys and
      # can verify tokens without being able to mint one.
      JWKS_URI: ${JWKS_URI:-http://api:8000/.well-known/jwks.json}
      # Tracing on by default in compose (off everywhere else -- see
      # analytics-service/src/main/resources/application.yml). This is what lets
      # `docker compose up` show a live trace with no extra step.
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      TZ: UTC
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
      # Needs the schema (outbox_events + the grant), not the API itself.
      migrate:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      # Spring Boot needs longer than uvicorn to come up.
      start_period: 40s

  dashboard:
    build:
      context: ./frontend
      args:
        # Next.js inlines NEXT_PUBLIC_* at build time, and these are called from
        # the BROWSER -- so they must be host-reachable URLs, not compose service
        # names. http://api:8000 would resolve inside the network but not in a tab.
        NEXT_PUBLIC_CRM_URL: ${NEXT_PUBLIC_CRM_URL:-http://localhost:8000}
        NEXT_PUBLIC_ANALYTICS_URL: ${NEXT_PUBLIC_ANALYTICS_URL:-http://localhost:8081}
    environment:
      TZ: UTC
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Runs the Java suite inside the build stage, where Maven and the dependency
  # cache already live. Not started by `docker compose up` -- invoke with:
  #   docker compose --profile test run --rm analytics-test
  # Testcontainers is deliberately not used at image-build time: `docker build`
  # has no daemon, so integration tests run here against the real db service.
  analytics-test:
    profiles: ["test"]
    build:
      context: ./analytics-service
      target: build
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/crm
      SPRING_DATASOURCE_USERNAME: analytics
      SPRING_DATASOURCE_PASSWORD: ${ANALYTICS_DB_PASSWORD:-analytics}
      TZ: UTC
    volumes:
      # Bind the live source so a test run picks up edits without an image
      # rebuild, and cache ~/.m2 so it doesn't re-download Maven Central.
      - ./analytics-service/src:/build/src:ro
      - ./analytics-service/pom.xml:/build/pom.xml:ro
      # The shared event contract, asserted from BOTH languages. Mounted rather
      # than copied so there is exactly one file: a change on either side turns
      # the other side's test red.
      - ./contracts:/build/contracts:ro
      - maven-cache:/root/.m2
    depends_on:
      db:
        condition: service_healthy
    command: mvn -B verify

volumes:
  pgdata:
  maven-cache:
