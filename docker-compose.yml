name: dealflow-agents

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
      # Pin the timezone explicitly. The legacy created_at columns are naive
      # `timestamp` and only hold UTC by accident of the image default -- make it
      # a guarantee, since a second service now reads these timestamps.
      TZ: UTC
      PGTZ: UTC
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:-analytics}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs ONLY on an empty data directory. On an existing volume, apply by hand:
      #   docker compose exec -T db psql -U crm -d crm < db/init/01-analytics-role.sql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: brings the schema to head, then exits. Both api and analytics wait
  # for it to *complete*, which is cleaner than coupling the analytics boot to the
  # API's health -- analytics needs the schema, not the API.
  migrate:
    build: .
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+psycopg://crm:crm@db:5432/crm
      TZ: UTC
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://crm:crm@db:5432/crm
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me-in-production-32b+}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      LLM_PROVIDER: ${LLM_PROVIDER:-stub}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TZ: UTC
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  analytics:
    build: ./analytics-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/crm
      SPRING_DATASOURCE_USERNAME: analytics
      SPRING_DATASOURCE_PASSWORD: ${ANALYTICS_DB_PASSWORD:-analytics}
      # Must match the API's secret: this service verifies the same HS256 token.
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me-in-production-32b+}
      TZ: UTC
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
      # Needs the schema (outbox_events + the grant), not the API itself.
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      # Spring Boot needs longer than uvicorn to come up.
      start_period: 40s

  # Runs the Java suite inside the build stage, where Maven and the dependency
  # cache already live. Not started by `docker compose up` -- invoke with:
  #   docker compose --profile test run --rm analytics-test
  # Testcontainers is deliberately not used at image-build time: `docker build`
  # has no daemon, so integration tests run here against the real db service.
  analytics-test:
    profiles: ["test"]
    build:
      context: ./analytics-service
      target: build
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/crm
      SPRING_DATASOURCE_USERNAME: analytics
      SPRING_DATASOURCE_PASSWORD: ${ANALYTICS_DB_PASSWORD:-analytics}
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me-in-production-32b+}
      TZ: UTC
    volumes:
      # Bind the live source so a test run picks up edits without an image
      # rebuild, and cache ~/.m2 so it doesn't re-download Maven Central.
      - ./analytics-service/src:/build/src:ro
      - ./analytics-service/pom.xml:/build/pom.xml:ro
      - maven-cache:/root/.m2
    depends_on:
      db:
        condition: service_healthy
    command: mvn -B verify

volumes:
  pgdata:
  maven-cache:
